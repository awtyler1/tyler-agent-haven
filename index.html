<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Tyler Insurance Group | Medicare FMO Built in Kentucky</title>
    <meta name="description" content="A Medicare FMO run by operators who still sell. Top contracts, fast written releases, day-one book ownership, and a full tech stack (quoting, enrollment, CRM) at no cost. Built in Kentucky for agents who want to grow." />
    <meta name="author" content="Tyler Insurance Group" />
    <link rel="canonical" href="https://www.tigagenthub.com/" />

    <meta property="og:site_name" content="Tyler Insurance Group" />
    <meta property="og:title" content="Tyler Insurance Group | Medicare FMO Built in Kentucky" />
    <meta property="og:description" content="A Medicare FMO run by operators who still sell. Top contracts, fast written releases, day-one book ownership, and a full tech stack at no cost." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tigagenthub.com/" />
    <meta property="og:image" content="https://www.tigagenthub.com/tyler-logo.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tyler Insurance Group | Medicare FMO Built in Kentucky" />
    <meta name="twitter:description" content="A Medicare FMO run by operators who still sell. Top contracts, fast releases, day-one book ownership, full tech stack at no cost." />
    <meta name="twitter:image" content="https://www.tigagenthub.com/tyler-logo.webp" />

    <!-- Organization + WebSite entity schema. Rendered in static HTML so search
         and AI crawlers (which do not run JavaScript) can resolve the entity.
         Per-page Article/FAQ schema is injected at build time by the prerender
         step (scripts/prerender.mjs) for the marketing routes. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.tigagenthub.com/#organization",
      "name": "Tyler Insurance Group",
      "alternateName": "TIG",
      "url": "https://www.tigagenthub.com/",
      "logo": "https://www.tigagenthub.com/tyler-logo.webp",
      "description": "An independent Medicare Field Marketing Organization (FMO) run by operators who still sell. TIG contracts and supports independent Medicare insurance agents with top carrier contracts, fast written releases, day-one book ownership, and a full technology stack at no cost.",
      "knowsAbout": [
        "Medicare Advantage",
        "Medicare Supplement",
        "Medicare Part D",
        "Medicare agent contracting",
        "FMO commissions and overrides",
        "insurance agent recruiting"
      ],
      "areaServed": {
        "@type": "State",
        "name": "Kentucky"
      },
      "founder": [
        { "@type": "Person", "name": "Austin Tyler", "jobTitle": "Broker Development" },
        { "@type": "Person", "name": "Andrew Horn", "jobTitle": "Broker Development" }
      ],
      "sameAs": [
        "https://www.tylerinsurancegroup.com/"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.tigagenthub.com/#website",
      "url": "https://www.tigagenthub.com/",
      "name": "Tyler Insurance Group",
      "publisher": { "@id": "https://www.tigagenthub.com/#organization" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
